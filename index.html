// ---- layout & style (edit here) ----
const W=[460,380,340,320,300], H=[90,64,52,44,40], GAP=110, ROW=54;
const FS=[28,20,15,13,12];
function tint(hex,a){const n=parseInt(hex.slice(1),16),r=n>>16,g=n>>8&255,b=n&255,m=c=>Math.round(c+(255-c)*a);return '#'+[m(r),m(g),m(b)].map(x=>x.toString(16).padStart(2,'0')).join('');}
function tree(){const root={c:[]},st=[root];DATA.forEach(([l,t,col])=>{const n={l,t,col,c:[]};st.length=l+1;(st[l]||root).c.push(n);st[l+1]=n;});return root.c[0];}
function place(n,x,y0){n.x=x;let y=y0;if(!n.c.length){n.y=y0;return y0+ROW*(n.l<3?1.4:1);}n.c.forEach(c=>{y=place(c,x+W[Math.min(n.l,4)]/2+GAP+W[Math.min(c.l,4)]/2,y);});n.y=(n.c[0].y+n.c[n.c.length-1].y)/2;return y+ROW*0.4;}
function style(n){const L=Math.min(n.l,4),col=n.col||'#00928F';const solid=L<=2;return{fillColor:solid?col:(L===3?tint(col,0.85):'#ffffff'),color:solid?'#ffffff':'#1a1a1a',borderColor:col,borderWidth:L<=2?2:1,borderStyle:'normal',fontFamily:'arial',fontSize:FS[L],textAlign:L<=1?'center':'left',textAlignVertical:'middle'};}
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
async function make(n,list){const L=Math.min(n.l,4);n.item=await miro.board.createShape({shape:L<=1?'round_rectangle':'rectangle',content:(L<=2?'<strong>'+esc(n.t)+'</strong>':esc(n.t)),x:n.x,y:n.y,width:W[L],height:H[L],style:style(n)});list.push(n);for(const c of n.c)await make(c,list);}
async function build(){const st=document.getElementById('st');const root=tree();place(root,0,0);const list=[];st.textContent='Creating '+DATA.length+' nodes…';await make(root,list);
 st.textContent='Linking…';const items=[root.item];for(const n of list){for(const c of n.c){await miro.board.createConnector({start:{item:n.item.id,snapTo:'right'},end:{item:c.item.id,snapTo:'left'},shape:'curved',style:{strokeColor:c.col||'#808080',strokeWidth:c.l<=2?3:1.5,startStrokeCap:'none',endStrokeCap:'none'}});}items.push(n.item);}
 const f=await miro.board.createFrame({title:'Playing to Win — Mind Map (Ch. 1–6)',x:list.reduce((a,n)=>a+n.x,0)/list.length,y:root.y,width:7000,height:Math.max(2000,list[list.length-1].y-list[0].y+800),style:{fillColor:'#ffffff'}});
 await miro.board.sendToBack(f).catch(()=>{});await miro.board.viewport.zoomTo(root.item);st.textContent='Done: '+list.length+' nodes.';}
document.getElementById('go').onclick=()=>build().catch(e=>{document.getElementById('st').textContent='Error: '+e.message;});
